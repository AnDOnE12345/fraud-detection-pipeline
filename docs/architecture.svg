<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-labelledby="title desc">
  <title id="title">Fraud pipeline architecture</title>
  <desc id="desc">Helm-deployed Kubernetes topology. Autoscaled UI and producer send payments through a six-partition Redpanda StatefulSet. A KEDA-scaled processor enriches events and persists partitioned Delta facts on MinIO PVCs. Autoscaled serving reads Silver facts and Gold query views for the UI.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
  <rect width="1040" height="400" fill="white"/>
  <rect x="10" y="15" width="1020" height="370" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="28" y="40" fill="#475569" font-family="Arial,sans-serif" font-size="14">Kubernetes / Helm release</text>
  <g fill="#f1f5f9" stroke="#64748b" stroke-width="1.5">
    <rect x="20" y="155" width="130" height="70"/>
    <rect x="190" y="155" width="135" height="70"/>
    <rect x="365" y="155" width="150" height="70"/>
    <rect x="555" y="155" width="175" height="70"/>
    <rect x="790" y="145" width="225" height="90"/>
    <rect x="555" y="30" width="175" height="55"/>
    <rect x="350" y="305" width="310" height="70"/>
  </g>
  <g fill="#0f172a" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">
    <text x="85" y="183">Web UI</text><text x="85" y="207" font-size="12">Deployment · HPA 1-3</text>
    <text x="257" y="183">Producer</text><text x="257" y="207" font-size="12">Deployment · HPA 1-5</text>
    <text x="440" y="176">Kafka / Redpanda</text><text x="440" y="198" font-size="12">StatefulSet 1 / 3</text><text x="440" y="216" font-size="12">6 partitions · PVCs</text>
    <text x="642" y="181">Processor group</text><text x="642" y="205" font-size="12">Deployment · KEDA 1-6</text>
    <text x="902" y="165">Delta on MinIO</text><text x="902" y="185" font-size="12">StatefulSet 1 / 4+</text><text x="902" y="204" font-size="12">partition facts + features</text><text x="902" y="223" font-size="12">persistent PVCs</text>
    <text x="642" y="57">Merchant CSV</text><text x="642" y="75" font-size="12">ConfigMap</text>
    <text x="505" y="329">Serving API</text><text x="505" y="350" font-size="12">Deployment · HPA 1-5</text><text x="505" y="368" font-size="12">Silver + Gold query views</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <path d="M150 190 H187"/><path d="M325 190 H362"/><path d="M515 190 H552"/>
    <path d="M730 190 H787"/><path d="M642 85 V152"/>
    <path d="M902 235 V340 H663"/><path d="M350 340 H85 V228"/>
  </g>
  <g fill="#334155" font-family="Arial,sans-serif" font-size="13">
    <text x="740" y="175">commit</text><text x="665" y="325">read / recover</text>
    <text x="110" y="329">REST + SSE results</text>
  </g>
</svg>
