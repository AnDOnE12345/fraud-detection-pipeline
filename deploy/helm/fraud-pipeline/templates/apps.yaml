apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.producer.enabled }}
  replicas: {{ .Values.producer.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      initContainers:
        - name: kafka-topic-init
          image: {{ .Values.kafka.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
{{ include "fraud-pipeline.topicInit" . | indent 14 }}
      containers:
        - name: producer
          image: {{ .Values.images.producer | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          resources:
            {{- toYaml .Values.producer.resources | nindent 12 }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: pipeline-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: producer
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  selector:
    app: producer
  ports:
    - name: http
      port: {{ .Values.service.producerPort }}
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.serving.enabled }}
  replicas: {{ .Values.serving.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: serving
  template:
    metadata:
      labels:
        app: serving
    spec:
      containers:
        - name: serving
          image: {{ .Values.images.serving | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          resources:
            {{- toYaml .Values.serving.resources | nindent 12 }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: pipeline-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: serving
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  selector:
    app: serving
  ports:
    - name: http
      port: {{ .Values.service.servingPort }}
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.ui.enabled }}
  replicas: {{ .Values.ui.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: {{ .Values.images.ui | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  selector:
    app: ui
  ports:
    - name: http
      port: {{ .Values.service.uiPort }}
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.processor.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
    spec:
      initContainers:
        - name: kafka-topic-init
          image: {{ .Values.kafka.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
{{ include "fraud-pipeline.topicInit" . | indent 14 }}
      containers:
        - name: processor
          image: {{ .Values.images.processor | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          resources:
            {{- toYaml .Values.processor.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: pipeline-secrets
          env:
            - name: MERCHANTS_PATH
              value: /data/merchants.csv
          volumeMounts:
            - name: merchants-data
              mountPath: /data/merchants.csv
              subPath: merchants.csv
          readinessProbe:
            exec:
              command: ["python", "-c", "import os,time; assert time.time()-os.stat('/tmp/processor-ready').st_mtime < 180"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["python", "-c", "import os,time; assert time.time()-os.stat('/tmp/processor-ready').st_mtime < 180"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: merchants-data
          configMap:
            name: merchants-data
