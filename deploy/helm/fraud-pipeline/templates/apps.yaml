apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.processor.replicas }}
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
    spec:
      initContainers:
        - name: kafka-topic-init
          image: {{ .Values.kafka.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until rpk cluster info -X brokers={{ .Values.kafka.bootstrap }} >/dev/null 2>&1; do
                echo "Waiting for Kafka..."
                sleep 2
              done
              rpk topic create {{ .Values.kafka.topic }} \
                --partitions {{ .Values.kafka.topicPartitions }} \
                --replicas 1 \
                -X brokers={{ .Values.kafka.bootstrap }} || true
              CURRENT_PARTITIONS=$(rpk topic describe {{ .Values.kafka.topic }} --print-summary \
                -X brokers={{ .Values.kafka.bootstrap }} | awk '$1 == "PARTITIONS" { print $2 }')
              if [ "$CURRENT_PARTITIONS" -lt {{ .Values.kafka.topicPartitions }} ]; then
                ADD_PARTITIONS=$(({{ .Values.kafka.topicPartitions }} - CURRENT_PARTITIONS))
                rpk topic add-partitions {{ .Values.kafka.topic }} \
                  --num "$ADD_PARTITIONS" \
                  -X brokers={{ .Values.kafka.bootstrap }}
              fi
      containers:
        - name: processor
          image: {{ .Values.images.processor | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          resources:
            {{- toYaml .Values.processor.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: pipeline-secrets
          env:
            - name: MERCHANTS_PATH
              value: /data/merchants.csv
          volumeMounts:
            - name: merchants-data
              mountPath: /data/merchants.csv
              subPath: merchants.csv
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/processor-ready"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["test", "-f", "/tmp/processor-ready"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: merchants-data
          configMap:
            name: merchants-data
