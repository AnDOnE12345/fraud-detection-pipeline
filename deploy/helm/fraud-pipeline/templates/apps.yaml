apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.producer.replicas }}
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: {{ .Values.images.producer | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: pipeline-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: producer
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  selector:
    app: producer
  ports:
    - name: http
      port: {{ .Values.service.producerPort }}
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.serving.replicas }}
  selector:
    matchLabels:
      app: serving
  template:
    metadata:
      labels:
        app: serving
    spec:
      containers:
        - name: serving
          image: {{ .Values.images.serving | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: pipeline-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: serving
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  selector:
    app: serving
  ports:
    - name: http
      port: {{ .Values.service.servingPort }}
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: {{ .Values.images.ui | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  selector:
    app: ui
  ports:
    - name: http
      port: {{ .Values.service.uiPort }}
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.processor.replicas }}
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
    spec:
      containers:
        - name: processor
          image: {{ .Values.images.processor | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: pipeline-secrets
          env:
            - name: MERCHANTS_PATH
              value: /data/merchants.csv
          volumeMounts:
            - name: merchants-data
              mountPath: /data/merchants.csv
              subPath: merchants.csv
      volumes:
        - name: merchants-data
          configMap:
            name: merchants-data
