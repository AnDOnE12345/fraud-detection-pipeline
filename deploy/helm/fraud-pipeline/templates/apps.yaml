apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.producer.replicas }}
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      initContainers:
        - name: kafka-topic-init
          image: {{ .Values.kafka.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until rpk cluster info -X brokers={{ .Values.kafka.bootstrap }} >/dev/null 2>&1; do
                echo "Waiting for Kafka..."
                sleep 2
              done
              rpk topic create {{ .Values.kafka.topic | default "transactions" }} \
                --partitions {{ .Values.kafka.topicPartitions }} \
                --replicas 1 \
                -X brokers={{ .Values.kafka.bootstrap }} || true
              CURRENT_PARTITIONS=$(rpk topic describe {{ .Values.kafka.topic }} --print-summary \
                -X brokers={{ .Values.kafka.bootstrap }} | awk '$1 == "PARTITIONS" { print $2 }')
              if [ "$CURRENT_PARTITIONS" -lt {{ .Values.kafka.topicPartitions }} ]; then
                ADD_PARTITIONS=$(({{ .Values.kafka.topicPartitions }} - CURRENT_PARTITIONS))
                rpk topic add-partitions {{ .Values.kafka.topic }} \
                  --num "$ADD_PARTITIONS" \
                  -X brokers={{ .Values.kafka.bootstrap }}
              fi
      containers:
        - name: producer
          image: {{ .Values.images.producer | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          resources:
            {{- toYaml .Values.producer.resources | nindent 12 }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: pipeline-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: producer
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  selector:
    app: producer
  ports:
    - name: http
      port: {{ .Values.service.producerPort }}
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.serving.replicas }}
  selector:
    matchLabels:
      app: serving
  template:
    metadata:
      labels:
        app: serving
    spec:
      containers:
        - name: serving
          image: {{ .Values.images.serving | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          resources:
            {{- toYaml .Values.serving.resources | nindent 12 }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: pipeline-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: serving
  labels:
    {{- include "fraud-pipeline.labels" . | nindent 4 }}
spec:
  selector:
    app: serving
  ports:
    - name: http
      port: {{ .Values.service.servingPort }}
      targetPort: 8000
---
